name: release

# A tag v* builds the standalone binaries, smoke-tests them and publishes a GitHub
# Release (a pre-release when the tag has a "-", e.g. v0.3.0-rc1). A pull request that
# touches the build runs the same build and smoke test and publishes nothing.
# Each system is built twice from the same commit, by PyInstaller and by Nuitka
# (s16-faster-start, measured before the switch); only the PyInstaller files are published.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            packager: pyinstaller
            asset: cast-tv-windows-x64.exe
          - os: windows-latest
            packager: nuitka
            asset: cast-tv-windows-x64-nuitka.exe
          - os: ubuntu-22.04          # an older glibc: the binary runs on newer distributions
            packager: pyinstaller
            asset: cast-tv-linux-x64
          - os: ubuntu-22.04
            packager: nuitka
            asset: cast-tv-linux-x64-nuitka
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the libraries Qt WebEngine needs to build and to run the window check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libnss3 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0
      - name: Install patchelf, which Nuitka needs on Linux
        if: runner.os == 'Linux' && matrix.packager == 'nuitka'
        run: sudo apt-get install -y patchelf
      - name: Make sure the WebView2 runtime is there (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) {
            "WebView2 runtime $((Get-ItemProperty $key).pv) is installed"
          } else {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
            Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait
            if (-not (Test-Path $key)) { throw "the WebView2 runtime did not install" }
            "WebView2 runtime $((Get-ItemProperty $key).pv) installed"
          }
      - name: Install the window extra and the packager
        shell: bash
        run: |
          if [ "${{ matrix.packager }}" = nuitka ]; then
            python -m pip install ".[window]" nuitka==4.3.5 zstandard ordered-set
          else
            python -m pip install ".[window]" pyinstaller
          fi
      - name: Write the Google client into the build
        run: python packaging/write_client.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: python -m pip install --no-deps --force-reinstall .   # the installed castlib carries the client
      - name: Build with PyInstaller
        if: matrix.packager == 'pyinstaller'
        shell: bash
        run: |
          pyinstaller --noconfirm packaging/cast-tv.spec
          src=dist/cast-tv; [ -f dist/cast-tv.exe ] && src=dist/cast-tv.exe
          mv "$src" "dist/${{ matrix.asset }}"
      - name: Build with Nuitka (the cache folder named by this run's id and attempt)
        if: matrix.packager == 'nuitka'
        run: python packaging/build_nuitka.py --out dist/${{ matrix.asset }}
      - name: Smoke test
        shell: bash
        run: |
          run=""; [ "$RUNNER_OS" = Linux ] && run="xvfb-run -a"   # the window check needs a display
          kind=""; [ "${{ matrix.packager }}" = nuitka ] && kind="--nuitka"
          $run python packaging/smoke.py $kind dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.build-info.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          # the Nuitka files are built and smoke-tested beside them, but not published yet
          gh release create "$TAG" assets/cast-tv-windows-x64.exe assets/cast-tv-linux-x64 \
            --repo "$GITHUB_REPOSITORY" --title "cast-tv $TAG" --generate-notes $pre
