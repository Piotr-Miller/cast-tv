[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-tv"
version = "0.2.0"
description = "Cast local files and cloud media to a Samsung TV over DLNA"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pyflakes"]

[tool.setuptools]
packages = ["castlib", "castlib.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
